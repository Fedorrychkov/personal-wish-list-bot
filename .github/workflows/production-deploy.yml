name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-personal-wish-list-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deployment files
        id: release
        env:
          RUNTIME_ENV: ${{ secrets.ENV_PROD }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .deploy/.docker/production .deploy/scripts
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'APP_IMAGE=%s\n' "$image" > .deploy/.release.env
          test -n "$RUNTIME_ENV"
          printf '%s' "$RUNTIME_ENV" > .deploy/.env.runtime
          test -n "$SERVICE_ACCOUNT"
          printf '%s' "$SERVICE_ACCOUNT" > .deploy/service-account.prod.json
          cp docker-compose.prod.yml .deploy/
          cp scripts/deploy-production.sh .deploy/scripts/
          cp .docker/production/Caddyfile .deploy/.docker/production/

      - name: Check deployment behavior
        run: |
          bash -n scripts/deploy-production.sh
          node --test scripts/production-deploy.test.mjs
          docker compose --env-file .deploy/.release.env -f .deploy/docker-compose.prod.yml config --quiet

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}
          secret-files: |
            build_env=.deploy/.env.runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package deployment
        run: tar -czf deployment.tgz -C .deploy .

      - name: Upload deployment
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_API_HOST }}
          username: ${{ secrets.PROD_API_USERNAME }}
          password: ${{ secrets.PROD_API_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: deployment.tgz
          target: ~/services/personal-wish-list-bot
          overwrite: true

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_API_HOST }}
          username: ${{ secrets.PROD_API_USERNAME }}
          password: ${{ secrets.PROD_API_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 20m
          script: |
            set -eu
            cd ~/services/personal-wish-list-bot
            umask 077
            tar -xzf deployment.tgz
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
            bash scripts/deploy-production.sh
